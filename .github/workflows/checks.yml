name: Game checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core learning and progress checks
        run: node --test tests/core.test.cjs
      - name: Install browser test tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and touch-screen flows
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
